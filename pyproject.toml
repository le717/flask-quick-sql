[project]
name = "flask-quick-sql"
version = "1.1.0"
description = "A quick way to run SQL in your Flask app."
authors = [{ name = "Caleb", email = "le717@users.noreply.github.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "Unlicense"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Framework :: Flask",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "flask>=3.1.2,<4",
    "flask-sqlalchemy>=3.1.1,<4",
]

[project.urls]
Repository = "https://github.com/le717/flask-quick-sql"

[tool.hatch.build.targets.sdist]
include = ["*.py"]

[tool.hatch.build.targets.sdist.force-include]
LICENSE = "LICENSE"
"README.md" = "README.md"

[tool.hatch.build.targets.wheel]
include = ["*.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
